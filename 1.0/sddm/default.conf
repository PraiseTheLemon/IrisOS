[General]
scale = 1.0
enable-animations = true
background-fill-mode = "fill"

[LockScreen]
display = true
background = "vibrant-purple-iris-flower.jpg"
use-background-color = false
background-color = "#161A1D"
blur = 48
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "JetBrains Mono"
font-size = 92
font-weight = 800
color = "#F5F3F4"

[LockScreen.Date]
display = true
position = "top-center"
align = "center"
format = "dddd, dd MMMM yyyy"
font-family = "JetBrains Mono"
font-size = 15
font-weight = 500
color = "#F5F3F4"

[LockScreen.Message]
display = true
position = "center"
align = "center"
text = "I.R.I.S. is watching over you."
font-family = "JetBrains Mono"
font-size = 14
font-weight = 500
color = "#E5383B"
display-icon = true
icon = "IrisOS_Logo2.svg"
icon-size = 70
paint-icon = true
spacing = 20

[LoginScreen]
background = "vibrant-purple-iris-flower.jpg"
use-background-color = false
background-color = "#161A1D"
blur = 26
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
active-size = 112
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 2
active-border-color = "#E5383B"
inactive-border-size = 0
margin-top = -30

[LoginScreen.LoginArea.Username]
font-family = "JetBrains Mono"
font-size = 17
font-weight = 700
color = "#F5F3F4"
margin = 10
text = "Officer"

[LoginScreen.LoginArea.PasswordInput]
width = 260
height = 38
display-icon = false
font-family = "JetBrains Mono"
font-size = 12
content-color = "#F5F3F4"
background-color = "#161A1D"
background-opacity = 0.68
border-size = 1
border-color = "#161A1D"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#E5383B"
background-opacity = 0.18
active-background-color = "#E5383B"
active-background-opacity = 0.32
content-color = "#F5F3F4"
active-content-color = "#FFFFFF"
border-size = 0
border-radius-left = 10
border-radius-right = 10
margin-left = 8
show-text-if-no-password = false
hide-if-not-needed = false
icon = "arrow-right.svg"
icon-size = 18

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Synchronizing with I.R.I.S."
font-family = "JetBrains Mono"
font-weight = 500
font-size = 12
icon-size = 24
color = "#E5383B"
spacing = 6

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrains Mono"
font-size = 11
font-weight = 400
normal-color = "#D3D3D3"
warning-color = "#E5383B"
error-color = "#E5383B"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 40
margin-right = 40
margin-bottom = 26
margin-left = 40
size = 26
border-radius = 8
spacing = 12
font-family = "JetBrains Mono"

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 160
background-color = "#161A1D"
background-opacity = 0.0
active-background-opacity = 0.18
content-color = "#F5F3F4"
active-content-color = "#F5F3F4"
border-size = 0
icon-size = 16

[LoginScreen.MenuArea.Session]
display = false

[LoginScreen.MenuArea.Layout]
display = false

[LoginScreen.MenuArea.Keyboard]
display = false

[Tooltips]
enable = true
font-family = "JetBrains Mono"
font-size = 11
content-color = "#F5F3F4"
background-color = "#161A1D"
background-opacity = 0.85
border-radius = 8